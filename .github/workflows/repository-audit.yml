name: Repository audit

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install direct Python dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install Node.js dependencies
        shell: pwsh
        run: npm ci --ignore-scripts

      - name: Verify Codex and Claude Skill parity
        shell: pwsh
        run: npm run check:skills

      - name: Run read-only repository audit
        shell: pwsh
        run: npm run audit
