generated_at_package_time:
  .claude/skills: Regenerated from canonical .agents/skills at package time. The public repository also
    checks in this generated mirror so Claude Code can discover project Skills immediately after clone;
    CI enforces parity.
excluded:
  produced_artifacts: Everything under artifacts/ except the runtime_data entries. These record what was
    made, not how to make it.
  node_modules: Rebuilt with npm install.
  sites-random-layout-catalog: Independent Git repository; see its own AGENTS.md.
provider_required_capabilities:
  image2_formal_generation: Seven-stage YAML authoring is portable; formal bitmap generation needs a model
    image provider.
  pptx_native_build: Theme/Layout core and PPTX adapters are portable; the native builder currently depends
    on a Codex runtime.
