    url: https://component.gallery/
    lessons:
      - components-have-semantic-roles
      - usage-guidelines-before-surface-style

  - id: godly
    name: Godly / Recent
    type: curated-discovery-gallery
    usage: reference_discovery_only
    url: https://godly.website/info
    warnings:
      - return-to-original-author-before-adoption
      - screenshots-are-not-reusable-assets

  - id: siteinspire
    name: SiteInspire
    type: curated-discovery-gallery
