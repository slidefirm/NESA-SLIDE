      - behavior-led-motion

  - id: studio-dumbar-modyfi
    name: Studio Dumbar/DEPT — Modyfi
    type: official-case-study
    usage: reference_only
    url: https://studiodumbar.com/work/modyfi
    lessons:
      - one-evolving-core-symbol
