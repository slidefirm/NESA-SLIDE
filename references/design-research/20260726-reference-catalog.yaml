version: 1
date: 2026-07-26
purpose: >
  國外設計參考與可重用素材的研究目錄。reference_only 只可研究方法，
  reusable_asset 才可進入素材候選；實際使用前仍需保存單一項目的授權證據。

reference_sources:
  - id: pentagram-moma
    name: Pentagram — MoMA
    type: official-case-study
    usage: reference_only
    url: https://www.pentagram.com/work/moma
    lessons:
      - strong-grid
      - dramatic-image-cropping
      - one-dominant-image
      - fixed-brand-anchor

  - id: pentagram-cooper-hewitt
    name: Pentagram — Cooper Hewitt
    type: official-case-study
    usage: reference_only
    url: https://www.pentagram.com/news/cooper-hewitt-a-democratic-design-identity
    lessons:
      - typography-as-identity
      - flexible-six-column-grid
      - structured-variation
      - editorial-density-modes

  - id: pentagram-nybg
    name: Pentagram — New York Botanical Garden
    type: official-case-study
    usage: reference_only
    url: https://www.pentagram.com/work/new-york-botanical-garden
    lessons:
      - gallery-like-whitespace
      - imagery-and-type
      - institutional-clarity

  - id: pentagram-garden-museum
    name: Pentagram — Garden Museum
    type: official-case-study
    usage: reference_only
    url: https://www.pentagram.com/work/garden-museum
    lessons:
      - concept-derived-shape-family
      - deliberately-imperfect-organic-forms
      - flexible-visual-vocabulary

  - id: dia-chaumont
    name: DIA — Chaumont Biennale
    type: official-case-study
    usage: reference_only
    url: https://dia.tv/project/chaumont-biennale/
    lessons:
