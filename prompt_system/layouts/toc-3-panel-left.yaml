id: toc-3-panel-left
display_name: 目錄 1+3 左側面板
media_requirement: no-image
family: 目錄

safe_area: [4, 6, 96, 94]

slots:
  - id: panel_left
    region: [4, 8, 33, 82]
    weight: hero
    note: "左側全高面板：章節導言、主標題、副標，可含插圖或說明文字"

  - id: chapter-1
    region: [41, 8, 18, 82]
    weight: primary
    note: "第一章節卡：編號、標題、說明"

  - id: chapter-2
    region: [61, 8, 18, 82]
    weight: primary
    note: "第二章節卡：編號、標題、說明"

  - id: chapter-3
    region: [80, 8, 17, 82]
    weight: primary
    note: "第三章節卡：編號、標題、說明"

alignment_rules:
  - "panel_left fills ~35% of slide width at full height"
  - "chapter-1.top == chapter-2.top == chapter-3.top"
  - "chapter-1.height == chapter-2.height == chapter-3.height"
  - "equal gaps between the three chapter cards"
  - "panel_left.right boundary creates a clear visual break before the cards"

visual_balance:
  method: panel-plus-columns
  description: >
    Left panel carries the section framing: main heading, intro copy, and optional
    illustration. Right two-thirds holds three equal-width vertical chapter cards
    in a single horizontal row. Panel weight anchors the slide; cards provide
    equal-priority scanning order for the three sections.
