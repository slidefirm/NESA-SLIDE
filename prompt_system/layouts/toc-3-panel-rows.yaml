id: toc-3-panel-rows
display_name: 目錄 1+3 面板列
media_requirement: no-image
family: 目錄

safe_area: [4, 6, 96, 94]

slots:
  - id: panel_left
    region: [4, 6, 32, 88]
    weight: hero
    note: "左側全高面板：章節導言、主標題、副標，可含插圖或說明文字"

  - id: chapter-1
    region: [40, 8, 56, 25]
    weight: primary
    note: "第一章節橫列：編號、標題、說明"

  - id: chapter-2
    region: [40, 37, 56, 25]
    weight: primary
    note: "第二章節橫列：編號、標題、說明"

  - id: chapter-3
    region: [40, 66, 56, 25]
    weight: primary
    note: "第三章節橫列：編號、標題、說明"

alignment_rules:
  - "panel_left fills ~35% of slide width at full height"
  - "chapter-1.left == chapter-2.left == chapter-3.left"
  - "chapter-1.width == chapter-2.width == chapter-3.width"
  - "equal gaps between the three chapter rows"

visual_balance:
  method: panel-plus-rows
  description: >
    Left panel anchors the section context. Right two-thirds holds three
    horizontal chapter rows of equal height, each with number, title, and
    short description. Three rows allow moderate subtitle length.
