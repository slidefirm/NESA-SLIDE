id: cards-1-plus-6
display_name: 卡片組 1+6
media_requirement: no-image
family: 模組陣列
safe_area: [8, 10, 92, 90]

slots:
  - id: title
    region: [8, 10, 84, 10]
    weight: hero

  - id: subtitle
    region: [8, 21, 84, 7]
    weight: tertiary

  - id: module-1
    region: [8, 34, 24, 16]
    weight: primary

  - id: module-2
    region: [38, 34, 24, 16]
    weight: primary

  - id: module-3
    region: [68, 34, 24, 16]
    weight: primary

  - id: module-4
    region: [8, 56, 24, 16]
    weight: primary

  - id: module-5
    region: [38, 56, 24, 16]
    weight: primary

  - id: module-6
    region: [68, 56, 24, 16]
    weight: primary

alignment_rules:
  - "title.centerX == safe_area.centerX"
  - "all modules share equal width and equal height"
  - "module-1.left == module-4.left"
  - "module-2.left == module-5.left"
  - "module-3.left == module-6.left"

visual_balance:
  method: dense-grid
  description: >
    One headline with six equal modules in a 3x2 grid.
    Use only when each item can remain short and structurally parallel.
