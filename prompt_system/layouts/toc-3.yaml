id: toc-3
display_name: 目錄 1+3 橫排
media_requirement: no-image
family: 目錄
safe_area: [8, 10, 92, 90]

slots:
  - id: title
    region: [8, 10, 84, 10]
    weight: hero

  - id: chapter-1
    region: [8, 28, 24, 56]
    weight: primary

  - id: chapter-2
    region: [38, 28, 24, 56]
    weight: primary

  - id: chapter-3
    region: [68, 28, 24, 56]
    weight: primary

header_system:
  default: centered_header
  override:
    condition: "top-right corner carries design weight (decorative element, badge, chapter number, etc.)"
    apply: content_anchored_left

alignment_rules:
  - "title: centered within 10%–90% safe zone by default"
  - "title: shift to left-anchored (title.left == chapter-1.left) when top-right corner has visual weight"
  - "chapter-1.top == chapter-2.top == chapter-3.top"
  - "chapter-1.width == chapter-2.width == chapter-3.width"
  - "equal gaps between the three cards"

visual_balance:
  method: equal-columns
  description: >
    TOC with three equal-width chapter cards in a single horizontal row.
    Each card contains chapter number, title, and brief description.
