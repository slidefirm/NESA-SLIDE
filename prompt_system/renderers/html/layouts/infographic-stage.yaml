      required_fields:
      - composition_intent
      - reading_path
      - signature_composition
      - ordinary_grid_loss
      - scene
      geometry_owner: per-slide-composition
      fixed_topology: false
      fixed_module_count: false
      fixed_column_count: false
    semantic_modules:
      grouping: whole-group-first
      first_direct_child: background-layer
      internal_layers: editable
    connectors:
      edit_contract: independent-loose-object
      z_order: behind-related-modules
