  - slot_id: subtitle
    source_ref: prompt_system/layouts/infographic-stage.yaml#slots[id=subtitle]
    geometry_ref: prompt_system/layouts/infographic-stage.yaml#slots[id=subtitle].region
    geometry_kind: region
    semantic_role: subtitle
    element: div.el
    geometry_transform: percent-region-to-1920x1080-px
    edit_contract: loose-edit-object
  - slot_id: infographic-stage
    source_ref: prompt_system/layouts/infographic-stage.yaml#slots[id=infographic-stage]
    geometry_ref: prompt_system/layouts/infographic-stage.yaml#slots[id=infographic-stage].region
    geometry_kind: region
    semantic_role: chart
    element: div.el
    geometry_transform: percent-region-to-1920x1080-px
    edit_contract: semantic-module-if-atomic-multilayer-unit
  - slot_id: source
    source_ref: prompt_system/layouts/infographic-stage.yaml#slots[id=source]
    geometry_ref: prompt_system/layouts/infographic-stage.yaml#slots[id=source].region
    geometry_kind: region
    semantic_role: subtitle
    element: div.el
    geometry_transform: percent-region-to-1920x1080-px
