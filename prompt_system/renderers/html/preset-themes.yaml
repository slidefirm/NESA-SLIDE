    scope: html-only
    pure_html: true
    auto_select: false
    design_dialect: after-dark-veil
    composition: "深色夜場以左右不對稱環境光建立重心，玻璃表面承載資訊，圓環只在開場與收束頁形成停頓"
    techniques: [multi-radial-gradient, ambient-glow, frosted-glass, translucent-border, soft-cast-shadow, solid-cream-type]
    palette:
      background: "#0B0D12"
      surface: "#171A24"
      text: "#F6EFE2"
      muted: "#B5B0A5"
      accent: "#C9A45C"
      support: "#C46B72"
    typography:
      display: Noto Sans TC
      body: Noto Sans TC
      utility: Roboto Mono
    background_pattern: nocturne-ambient
    background_graphics: css-ambient-field
    visual_asset_policy: no-raster-assets
    continuity_element:
      id: ambient-orbit-field
      form: two restrained radial light pools with occasional concentric closing ring
      rules:
        - "光暈只屬背景，並限制不透明度"
        - "玻璃只作為 semantic module background layer，避免與內容脫鉤"
        - "圓環只用於封面或收束頁，不作填空裝飾"
    surface:
      default: night-glass
      material: dark-translucent-glass
      shared_traits: [low-opacity-glass, fine-warm-border, ambient-shadow, restrained-inner-light]
      semantic_variants:
        index: staggered-glass-panels
        audience: open-dark-columns
        metrics: luminous-score-fields
        contrast: warm-cool-glass-pair
        timeline: glass-stage-strips
        process: bordered-glass-nodes
        quote: open-quote-with-rail
      forbidden: [identical-glass-everywhere, high-opacity-panels, detached-floating-orbs, gradient-text]
