    base_theme: grainy-editorial
    scope: html-only
    pure_html: true
    auto_select: false
    design_dialect: ivory-arc-editorial
    composition: 暖象牙紙面以高對比襯線標題、寬留白、上下細框線與從邊緣切入的單一弧線建立克制的商務出版感；照片區一律改由文字、數字、規則線與原生資訊模組承接
    techniques: [ivory-paper-field, perimeter-hairline, edge-entry-arc, high-contrast-serif, open-business-ledger]
    palette:
      background: "#F5F1EB"
      surface: "#FBF8F2"
      text: "#241F1C"
      muted: "#6D6660"
      accent: "#4B403B"
      support: "#9B8D83"
    typography:
      display: Noto Serif TC
      body: Noto Sans TC
      utility: Roboto Mono
    background_pattern: ivory-arc-frame
    background_graphics: css-perimeter-arc-field
    visual_asset_policy: pattern-and-geometry-only
    continuity_element:
      id: perimeter-arc-rule
      form: one restrained hairline arc entering from an outer edge and meeting the horizontal frame rhythm
      rules:
        - 弧線只存在背景 Pattern 或作為有語意的結構線，不得成為可選取的漂浮裝飾物件。
        - 每頁最多保留一個主要弧線轉折，並讓上下框線維持安靜、連續的頁面節奏。
        - 內容模組以開放欄位、細則與低對比紙面為主，不以照片、插畫或厚重卡片填滿留白。
    surface:
      default: open-hairline-sheet
      material: warm-ivory-editorial-paper
      shared_traits: [square-edge, low-opacity-paper, fine-ink-rule, no-cast-shadow]
      semantic_variants:
        cover: open-centered-field
        priorities: ordered-hairline-ledger
        metrics: monochrome-score-fields
        comparison: split-rule-field
        timeline: perimeter-track
      forbidden: [photo-slot, raster-background, identical-card-grid, floating-glass-card, high-contrast-glow]
