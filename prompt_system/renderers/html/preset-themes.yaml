    display_name: 月光菜園試作誌
    base_theme: festive-patterned
    scope: html-only
    pure_html: true
    auto_select: false
    design_dialect: moonlit-garden-poster
    composition: 深靛海報底面搭配月光黃與薄荷綠的田畦節奏，內容像一張可讀的社區試作地圖，不把裝飾誤當成主訊息
    techniques: [woven-poster-rhythm, terrace-grid, clipped-paper-surface, solid-cream-type]
    palette:
