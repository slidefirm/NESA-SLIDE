    pure_html: true
    auto_select: false
    design_dialect: ledger-spine-editorial
    composition: 暖紙編輯場以頁邊索引軌、分段規則、驗證記號與非等重語意表面組成可追溯的 AI 責任路徑；不使用照片、玻璃卡片或裝飾性背景圖形
    techniques: [ledger-spine-editorial, indexed-margin-rail, ruled-semantic-surface, verification-mark, solid-ink-type]
    palette:
      background: "#F6F1E7"
      surface: "#FFFDF7"
      text: "#1F3140"
      muted: "#66717A"
      accent: "#B84B32"
      support: "#1F7B73"
    typography:
      display: Noto Sans TC
      body: Noto Sans TC
      utility: Roboto Mono
    background_pattern: fine-ledger-grid
    background_graphics: css-ledger-field
    visual_asset_policy: no-raster-assets
    continuity_element:
      id: folio-rail
      form: 3px vermilion margin rail with sparse teal verification ticks
      rules:
        - 只可作為頁邊索引、內容關係線、流程軸或驗證記號。
        - 不得形成橢圓、器物輪廓、漂浮色塊或背景場景。
        - 每頁只出現一次主要 rail，並與當頁閱讀順序或責任關係直接相連。
    surface:
      default: ledger-sheet
      material: warm-editorial-paper
      shared_traits: [squared-asymmetric-edges, ink-rule, quiet-paper-field, semantic-rail]
      semantic_variants:
        index: ruled-index-rows
        audience: annotated-columns
        map: indexed-route-sheet
        metrics: underlined-evidence-fields
        contrast: split-ledger-fields
        timeline: horizontal-folio-track
