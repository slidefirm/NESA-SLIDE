    visual_asset_policy: generated-raster-background-opt-in
    palette:
      background: "#F4EBDD"
      surface: "#F4EBDD"
      text: "#173F3A"
      muted: "#5F716C"
      accent: "#D9563F"
      support: "#2F7467"
  clinical-evidence-atlas:
    display_name: 臨床證據圖譜
    base_theme: brand-editorial
    scope: html-only
    pure_html: true
    auto_select: false
    design_dialect: clinical-evidence-editorial
    composition: 白色與霧藍灰構成臨床證據頁面，青綠證據脊線串接病程、效益與成熟度，珊瑚紅只標示風險、限制與需回退的決策點
    techniques: [clinical-evidence-rule, evidence-spine, risk-marker, solid-ink-type]
    palette:
      background: "#F5F8FA"
      surface: "#FFFFFF"
      text: "#17343D"
      muted: "#58707A"
      accent: "#0B7A75"
      support: "#D96C5F"
    background_pattern: none
    background_graphics: safe-zone-minimal-raster
    visual_asset_policy: generated-raster-background-opt-in
  signal-route-atlas:
    display_name: 訊號軌道路線圖
    base_theme: product-strategy-signal
    scope: html-only
    pure_html: true
    auto_select: true
    design_dialect: transfer-atlas-system
    composition: 暖霧地圖紙以一條語意主線串接終端窗、時刻表、票券、轉運交叉、派工線、決策分支與健康看板
    techniques: [transfer-spine, station-window, perforated-ticket, junction-field, dispatch-lane, solid-ink-type]
    continuity_element:
      id: transfer-spine
      form: 8px orange-teal semantic route used only as a content connector
      rules:
        - 每頁只保留一個主要轉乘結構，且必須直接表達內容關係。
        - 主線依頁面語意改成時刻表、流程線、交叉路口、決策分支或狀態分隔。
        - 禁止把同一條斜線當成十二頁共同背景裝飾。
    surface:
      default: transfer-map-sheet
      material: ink-on-warm-map-stock
      semantic_variants: [station-rows, platform-bays, ticket-ledger, mainline, junction-field, dispatch-lanes, decision-branch, parallel-lines, timetable, health-board]
      forbidden: [generic-equal-card-array, floating-glass-card, repeated-diagonal-background-route]
    background_pattern: none
    background_graphics: safe-zone-minimal-raster
    visual_asset_policy: generated-raster-background-opt-in
    palette:
      background: "#F2EFE5"
      surface: "#FAF8F1"
      text: "#102A36"
      muted: "#4E6269"
      accent: "#D45A2F"
      support: "#1C7777"
  scent-veil-launch:
    display_name: 香氣薄霧發表誌
    base_theme: brand-editorial
    scope: html-only
    pure_html: true
    auto_select: false
    design_dialect: editorial-scent-thread
    composition: 柔白紙面搭配多層低對比柔霧漸層、半透明紙質 Surface、細玫瑰框線與可見但克制的柔陰影，並以局部底線、索引節點與單一香氣線串接全份頁面；漸層、霧層與陰影是本 Preset 的正式 signature，不得被基底 Theme 扁平化
    techniques: [editorial-scent-thread, partial-text-frame, index-node, structural-rule, solid-sans-type, soft-veil-gradient, paper-texture, translucent-paper, restrained-shadow]
    palette:
      background: "#FAF4F6"
      surface: "#FFFDFE"
      text: "#4D3545"
      muted: "#876D7D"
      accent: "#AD496F"
      support: "#C99CA9"
    typography:
      display: Noto Sans TC
      body: Noto Sans TC
      utility: Roboto Mono
    background_pattern: none
    background_graphics: safe-zone-minimal-raster
    visual_asset_policy: generated-raster-background-opt-in
    background_asset:
      path: assets/scent-paper-field-v1.png
      provenance: built-in-imagegen
      constraints: [no-text, no-objects, no-geometric-motifs, low-contrast, edge-to-edge]
    continuity_element:
      id: editorial-scent-thread
      form: 2px rose rule with restrained index nodes
      rules:
        - 只可作為文字框線、分隔線、流程線或節點連接線。
        - 不得形成橢圓、器物輪廓、漂浮色塊或背景場景。
        - 每頁只出現一次主要 thread，並與當頁內容關係直接相連。
    surface:
      default: veil-pane
      material: translucent-perfume-paper
      shared_traits: [asymmetric-corner-rhythm, fine-rose-border, soft-cast-shadow, restrained-inset-light]
      semantic_variants:
        index: staggered-tall-panes
        audience: edge-lit-columns
        map: framed-core-and-small-panes
        metrics: luminous-quadrants
        contrast: mirrored-wide-panes
        timeline: translucent-stage-strips
        ledger: one-bounded-table-sheet
      forbidden: [large-empty-card, identical-card-everywhere, detached-floating-geometry, high-contrast-glow]
  ai-operations-signal:
    display_name: AI 營運訊號軸
    base_theme: dark-circuit
    scope: html-only
    pure_html: true
    auto_select: false
    design_dialect: governed-operations-axis
    composition: 深綠營運底面以萊姆狀態線與藍色交接線串接任務、責任、證據、控制與回寫，讓每頁都能回答誰負責、何時交接、如何驗證與何時撤回
    techniques: [operating-axis, verified-status-strip, handoff-route, control-ledger, solid-signal-type]
    palette:
      background: "#101912"
      surface: "#162219"
      text: "#F2F5E9"
      muted: "#9FB0A0"
      accent: "#C8F169"
      support: "#59A7FF"
    background_pattern: none
