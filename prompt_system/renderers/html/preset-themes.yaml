schema_version: 2
id: html-preset-themes
display_name: HTML Preset Themes
purpose: >
  保存可重複使用、可獨立選取的 HTML Preset 視覺契約。
  Preset 只決定配色、字體、背景 Pattern、陰影、材質與元件語言；
  不保存也不載入舊案例、內容、Layout 或任意 CSS，並且不自動擴張為 Image2 / PPTX adapter。

runtime_contract:
  css_owner: preset-appearance
  content_source: caller-only
  layout_source: layout-core-only
  legacy_case_import: forbidden
  embedded_css: forbidden
  layout_selectors: forbidden
  geometry_properties: forbidden
  important: forbidden

content_policy:
  default_mode: new-deck
  preset_demo_mode: explicit-only
  demo_source: external-isolated-route-only
  reusable_preset_demo_fields: forbidden

selection_policy:
  auto_select: curated-presets-only
  manual_select: base-themes-and-presets
  random_hue_mutation: forbidden
  text_color_effects: [solid-color-only, no-glow, no-gradient-text]
  max_accent_hues: 2
  contrast:
    normal_text_minimum: 4.5
    large_text_minimum: 3.0

themes:
  sepia-retail-case:
    display_name: 暖褐編輯報告
    base_theme: grainy-editorial
    scope: html-only
    pure_html: true
    auto_select: true
    design_dialect: warm-editorial-field
    composition: 左重暖褐編輯欄搭配寬留白，資訊沿紙面基準線與短章節標記展開
    techniques: [warm-paper-tonality, narrow-column-rule, warm-matte-shadow, solid-ink-type]
    palette:
      background: "#f3ede3"
      surface: "#fffaf2"
      text: "#2d211b"
      muted: "#6f5e54"
      accent: "#a96938"
      support: "#d6b78f"
    background_pattern: none
    background_graphics: safe-zone-minimal-raster
    visual_asset_policy: generated-raster-background-opt-in
  dark-ai-city:
    display_name: 深色城市軌道
    base_theme: dark-circuit
    scope: html-only
    pure_html: true
    auto_select: true
    design_dialect: urban-signal-field
    composition: 深色城市夜景色調以均勻低頻材質與克制明暗層次承托中央主張，背景維持無方向、無局部焦點的連續質感
    techniques: [urban-night-tonality, ambient-depth, low-light-gradient, solid-signal-type]
    palette:
      background: "#0b1220"
      surface: "#111d2c"
      text: "#f5f7fa"
      muted: "#9aa7b8"
      accent: "#3fd0e8"
      support: "#62d6a7"
    background_pattern: none
    background_graphics: safe-zone-minimal-raster
    visual_asset_policy: generated-raster-background-opt-in
  dark-city-network-report:
    display_name: 深色城市編輯
    base_theme: brand-editorial
    scope: html-only
    pure_html: true
    auto_select: true
    design_dialect: civic-network-editorial
    composition: 深色專題封面與資料新聞內容頁交替，以均勻城市夜色材質、內收陰影與編輯細則維持連續
    techniques: [civic-night-tonality, matte-depth, inset-shadow, editorial-rule]
    palette:
      background: "#091525"
      surface: "#10253a"
      text: "#ffffff"
      muted: "#d9e2ee"
      accent: "#75bfe8"
      support: "#d4af7e"
    background_pattern: none
    background_graphics: safe-zone-minimal-raster
    visual_asset_policy: generated-raster-background-opt-in
  moonlit-herbarium-atlas:
    display_name: 月夜標本觀測誌
    base_theme: soft-organic-education
    scope: html-only
    pure_html: true
    auto_select: false
    design_dialect: botanical-institution-editorial
    composition: 深礦綠與暖紙色構成標本誌語氣，背景只保留均勻低頻紙質與柔和色場，維持無方向、無局部焦點的連續質感
    techniques: [botanical-palette, moonlit-paper-tonality, low-frequency-material, solid-weighted-type]
    background_pattern: none
