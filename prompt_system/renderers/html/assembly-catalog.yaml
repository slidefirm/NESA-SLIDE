guardrails:
  raster_assets: provenance-tracked-opt-in
  decorative_images: licensed-subject-or-edge-only
  ambient_design: [gradient, pattern, border, typography, python-generated-svg-data-chart, licensed-archival-crop]
  text_glow: forbidden
  gradient_text: discouraged
  content_area_fill_limit: 0.88
  structured_body_min_visible_width_ratio_without_counterweight: 0.68
  balance_measurement_excludes: [content-area, layout-only-container, transparent-slot]
  minimum_safe_margin_px: 76
  title_must_not_outweigh_subtitle_width: true

pattern_effect_policy:
  placement: background-only
  selectable: false
  fallback: static-css
  required_labels: [compatible_with, performance, readability_risk, projection_safe, max_opacity]
  performance_levels: [light, medium, heavy]
  readability_risk_levels: [low, medium, high]
