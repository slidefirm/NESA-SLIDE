    header_modes: [embedded-dual-header]
    surface_modes: [split-field]
  infographic-stage:
    composition_variants: [authored-page-composition]
    header_modes: [reserved-top-band]
    surface_modes: [content-authored-stage]
  title-center:
    composition_variants: [centered-decision-pause]
    header_modes: [center-stack]
    surface_modes: [open-field]
theme_selection_profiles:
  line-argument-journal:
    best_for: [論證導向編輯, 證據與政策說明, 決策敘事]
    avoid_for: [高頻即時儀表板, 強裝飾娛樂宣傳]
    signature_compositions: [linear-proof-editorial, editorial-spine]
  field-index-manual:
    best_for: [田野作業交接, 索引式參考手冊, 服務流程指引]
    avoid_for: [高光品牌發表, 電影式英雄場景]
    signature_compositions: [field-index-ledger, ledger-rail]
  tide-signal-observatory:
    best_for: [監測與基準判讀, 訊號異常說明, 介入門檻決策]
    avoid_for: [粉彩生活風格, 高密度報紙編排]
    signature_compositions: [tidal-observation-console, signal-axis]
  craft-archive-editions:
    best_for: [文化檔案編目, 技藝傳承記錄, 出處與版次說明]
    avoid_for: [即時事件指揮, 霓虹科技宣傳]
