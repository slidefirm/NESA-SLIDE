schema_version: 3
id: html-layout-catalog
display_name: HTML Layout Catalog
source_of_truth: prompt_system/layouts/*.yaml
policy: >
  所有 Layout 都對使用者與模型公開，並以 Layout 身分呈現。純文字、圖示、表格、流程與
  資料結構可穩定表達的版型可用於 pattern-only；需要照片、插圖、地圖形狀或人物
  視覺的版型仍完整可見，但只有 image-planned 才能自動選擇或明確指定。

visibility_policy: all-core-layouts
auto_selection_policy: deck-asset-policy-gated
default_asset_policy: pattern-only
asset_policies:
  pattern-only:
    description: HTML deck uses only Theme or Preset patterns and native semantic elements.
    allowed_media_requirements: [no-image]
  image-planned:
    description: HTML deck will receive real image assets before final delivery.
    allowed_media_requirements: [no-image, with-image]
# Layout capability classification for HTML stress tests and renderer routing.
# `no-image` is reserved for text, semantic icons, tables, flows, and data structures that HTML
# can express directly. `with-image` means the intended composition needs a
# visual asset or illustration-like region; its stress-test renderer uses a
# plain filled placeholder and never draws a fake image with HTML/SVG/CSS.
# Canonical classification lives in each prompt_system/layouts/*.yaml as
# `media_requirement`. The two lists below are a compatibility projection and
# must mirror every core Layout exactly once.
media_rendering_policy:
  no-image: semantic-native
  with-image: placeholder-fill
layout_media_modes:
  no-image:
    - before-after
    - cards-1-plus-2
    - cards-1-plus-3
    - cards-1-plus-4
    - cards-1-plus-5
