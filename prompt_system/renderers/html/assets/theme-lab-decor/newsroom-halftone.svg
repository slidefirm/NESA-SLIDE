  <circle cx="1494" cy="410" r="126" fill="#b8362e"/>
  <path d="M1494 194v432M1278 410h432" stroke="#f2efe7" stroke-opacity=".62" stroke-width="6"/>
  <g transform="rotate(2 934 872)" filter="url(#shadow)">
    <path d="M178 820l1120-48 18 214-1130 56z" fill="#faf8f2"/>
    <path d="M236 858h700M236 902h960M236 946h810" stroke="#1d1d1b" stroke-opacity=".34" stroke-width="11"/>
    <path d="M1028 816h214v126h-214z" fill="#b8362e"/>
  </g>
  <g fill="none" stroke="#b8362e" stroke-width="6">
