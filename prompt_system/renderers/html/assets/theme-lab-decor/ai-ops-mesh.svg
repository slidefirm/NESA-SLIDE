<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-label="AI operations governed mesh">
  <metadata>Original project-owned SVG scene. A luminous task mesh, controlled gateways and soft glass plates create depth behind analytical content without becoming an editable object.</metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08120d"/>
      <stop offset=".48" stop-color="#0e1d15"/>
      <stop offset="1" stop-color="#10251a"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#59a7ff" stop-opacity=".30"/>
      <stop offset=".45" stop-color="#70d6a0" stop-opacity=".14"/>
      <stop offset="1" stop-color="#70d6a0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#59a7ff"/>
      <stop offset=".52" stop-color="#70d6a0"/>
      <stop offset="1" stop-color="#c8f169"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#b8d7c2" stroke-opacity=".055"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <ellipse cx="1500" cy="500" rx="560" ry="470" fill="url(#halo)"/>
