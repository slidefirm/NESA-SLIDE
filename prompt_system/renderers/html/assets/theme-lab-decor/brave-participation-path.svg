    <circle cx="1458" cy="318" r="30"/><circle cx="1746" cy="174" r="30"/>
  </g>
  <g fill="#d66a43">
    <circle cx="1110" cy="834" r="10"/><circle cx="1458" cy="318" r="10"/>
  </g>
  <g fill="#5e9f87">
    <circle cx="1266" cy="604" r="10"/><circle cx="1746" cy="174" r="10"/>
  </g>
  <g transform="translate(1516 680)" fill="none" stroke="#203d34" stroke-opacity=".30">
    <circle r="178" stroke-width="3"/><circle r="132" stroke-width="2" stroke-dasharray="7 11"/>
    <circle r="82" stroke="#d66a43" stroke-opacity=".52" stroke-width="5"/>
