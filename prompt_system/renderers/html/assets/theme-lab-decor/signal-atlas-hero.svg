<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-label="Layered decision atlas hero">
  <metadata>Original project-owned SVG scene. A layered transit atlas, transfer hub and city blocks create a large asymmetrical hero while preserving a quiet left reading field.</metadata>
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#edf4f6"/>
      <stop offset=".55" stop-color="#e6f0f2"/>
      <stop offset="1" stop-color="#d9e8eb"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f5fbfc" stop-opacity=".95"/>
      <stop offset=".55" stop-color="#b9d8dc" stop-opacity=".42"/>
      <stop offset="1" stop-color="#6aa2a9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="minorGrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#5e7f8d" stroke-opacity=".09" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#17384b" flood-opacity=".14"/>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#wash)"/>
