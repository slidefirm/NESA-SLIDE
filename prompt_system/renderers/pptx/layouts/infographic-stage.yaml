schema_version: 1
kind: layout_adapter
renderer: pptx
layout_id: infographic-stage
family: infographic
support_status: baseline-from-core
source:
  path: prompt_system/layouts/infographic-stage.yaml
  sha256: 21c9254e44713d7cb61fa663bb6b758854aa2bb5a7430878e38f6379f3d396a2
core_refs:
  media_requirement: prompt_system/layouts/infographic-stage.yaml#media_requirement
  slots: prompt_system/layouts/infographic-stage.yaml#slots
  safe_area: prompt_system/layouts/infographic-stage.yaml#safe_area
  alignment: prompt_system/layouts/infographic-stage.yaml#alignment_rules
  visual_balance: prompt_system/layouts/infographic-stage.yaml#visual_balance
  decoration: null
  element_contracts: prompt_system/layouts/infographic-stage.yaml#element_contracts
projection:
  output: pptx-layout-and-placeholder-manifest
  layout_name: layout--infographic-stage
  parent_master_ref: selected-theme-adapter.projection.master_name
  background_role: content-c
  background_role_ref: selected-theme-adapter.projection.background_set_ref#roles[id=content-c]
  placeholder_geometry_policy: role-placeholder-first-then-fit-core-content-semantics
  slide_size_in:
  - 13.333
  - 7.5
  slot_entries:
  - slot_id: title
    source_ref: prompt_system/layouts/infographic-stage.yaml#slots[id=title]
    geometry_ref: prompt_system/layouts/infographic-stage.yaml#slots[id=title].region
    geometry_kind: region
    semantic_role: title
    placeholder_type: title
    geometry_transform: percent-region-to-13.333x7.5-inch
    materialization: native-text-or-shape
  - slot_id: subtitle
    source_ref: prompt_system/layouts/infographic-stage.yaml#slots[id=subtitle]
    geometry_ref: prompt_system/layouts/infographic-stage.yaml#slots[id=subtitle].region
    geometry_kind: region
    semantic_role: subtitle
    placeholder_type: subtitle
    geometry_transform: percent-region-to-13.333x7.5-inch
    materialization: native-text-or-shape
  - slot_id: infographic-stage
    source_ref: prompt_system/layouts/infographic-stage.yaml#slots[id=infographic-stage]
    geometry_ref: prompt_system/layouts/infographic-stage.yaml#slots[id=infographic-stage].region
    geometry_kind: region
    semantic_role: chart
    placeholder_type: chart
    geometry_transform: percent-region-to-13.333x7.5-inch
    materialization: native-chart-or-hybrid
  - slot_id: source
    source_ref: prompt_system/layouts/infographic-stage.yaml#slots[id=source]
    geometry_ref: prompt_system/layouts/infographic-stage.yaml#slots[id=source].region
    geometry_kind: region
    semantic_role: subtitle
    placeholder_type: subtitle
    geometry_transform: percent-region-to-13.333x7.5-inch
    materialization: native-text-or-shape
  rules:
  - references/pptx-generation-rules.md
  element_contracts:
    page_composition:
      source: page-keyed-content-manifest
      required_fields:
      - composition_intent
      - reading_path
      - signature_composition
      - ordinary_grid_loss
      - scene
      geometry_owner: per-slide-composition
      fixed_topology: false
      fixed_module_count: false
      fixed_column_count: false
    semantic_modules:
      grouping: whole-group-first
      first_direct_child: background-layer
      internal_layers: editable
    connectors:
      edit_contract: independent-loose-object
      z_order: behind-related-modules
