version: 1
description: >
  Content pattern taxonomy defines the semantic content skeleton of a slide.
  It should be inferred from content quantity and relationships before layout selection.

content_patterns:
  - id: 1-plus-1
    display_name: 1 標題 + 1 核心訊息
    summary: 一個主標題搭配一句核心觀點或單一主體
    structure:
      title_count: 1
      key_point_count: 1
      visual_count: 0
      sequence: false
      comparison: false
      data: false
    suitable_roles:
      - cover
      - warmup_question
      - objective
      - problem_statement
      - closing
    layout_bias:
      - statement
      - hero-focus
    notes:
      - 強調單一訊息，不應塞入太多補充條列

  - id: 1-plus-2
    display_name: 1 標題 + 2 個並列重點
    summary: 一個標題搭配兩個平行要素或二分對照
    structure:
      title_count: 1
      key_point_count: 2
      visual_count: 0
      sequence: false
      comparison: optional
      data: false
    suitable_roles:
      - warmup_question
      - framework_explainer
      - comparison
    layout_bias:
      - two-column-equal
      - comparison-split
    notes:
      - 若兩者立場相反，應升級成 comparison-split

  - id: 1-plus-3
    display_name: 1 標題 + 3 重點
    summary: 一個標題搭配三個平行重點，是教學型 deck 的高頻骨架
    structure:
      title_count: 1
      key_point_count: 3
      visual_count: 0
      sequence: false
      comparison: false
      data: false
    suitable_roles:
      - speaker_intro
      - objective
      - framework_explainer
      - exercise
      - takeaway
    layout_bias:
      - three-column-equal
      - three-cards
      - title-plus-3-features
    notes:
      - 三個重點應盡量等權，避免其中一塊資訊量過重

  - id: 1-plus-4
    display_name: 1 標題 + 4 重點
    summary: 一個標題搭配四個平行重點或分類
    structure:
      title_count: 1
      key_point_count: 4
      visual_count: 0
      sequence: false
      comparison: false
      data: false
    suitable_roles:
      - speaker_intro
      - framework_explainer
      - agenda
      - takeaway
    layout_bias:
      - four-column-equal
      - two-by-two-grid
    notes:
      - 若四點其實有先後順序，應改判為 1-plus-sequence

  - id: 1-plus-n-list
    display_name: 1 標題 + 多項清單
    summary: 一個標題搭配多個條列、章節或模組
    structure:
      title_count: 1
      key_point_count: n
      visual_count: 0
      sequence: optional
      comparison: false
      data: false
    suitable_roles:
      - agenda
      - exercise
      - takeaway
    layout_bias:
      - agenda-grid
      - large-bullet-list
      - multi-column-list
    notes:
      - 要先判斷是單純列表還是隱含順序

  - id: 1-plus-sequence
    display_name: 1 標題 + 流程 / 順序
    summary: 一個標題搭配有先後關係的步驟或階段
    structure:
      title_count: 1
      key_point_count: n
      visual_count: 0
      sequence: true
      comparison: false
      data: false
    suitable_roles:
      - agenda
      - exercise
      - framework_explainer
    layout_bias:
      - sequence-flow
      - timeline
      - arrows
    notes:
      - 順序關係比等權分欄更重要

  - id: 1-plus-comparison
    display_name: 1 標題 + 比較
    summary: 一個標題搭配兩組對照內容
    structure:
      title_count: 1
      key_point_count: 2-groups
      visual_count: optional
      sequence: false
      comparison: true
      data: false
    suitable_roles:
      - comparison
      - framework_explainer
      - example_demo
    layout_bias:
      - comparison-split
      - before-after
    notes:
      - 兩邊需同類型、同層級，方便公平對照

  - id: 1-plus-example-block
    display_name: 1 標題 + 範例區塊
    summary: 一個標題搭配一個或兩個大內容區塊，用來展示範例、輸入輸出或案例片段
    structure:
      title_count: 1
      key_point_count: block-based
      visual_count: optional
      sequence: false
      comparison: optional
      data: false
    suitable_roles:
      - example_demo
      - problem_statement
    layout_bias:
      - example-focus
      - stacked-blocks
      - side-by-side-example
    notes:
      - 比起細碎卡片，更需要清楚分區與可讀性

  - id: 1-plus-question-answer
    display_name: 1 標題 + 問答
    summary: 一個標題搭配問題與回答，或問題與解析
    structure:
      title_count: 1
      key_point_count: qa-pair
      visual_count: 0
      sequence: false
      comparison: false
      data: false
    suitable_roles:
      - warmup_question
      - example_demo
      - framework_explainer
    layout_bias:
      - qa-stack
      - question-top-answer-bottom
    notes:
      - 問句與答句層級必須清楚區分

  - id: 1-plus-visual-plus-3
    display_name: 1 標題 + 1 主視覺 + 3 重點
    summary: 一個標題搭配一個主視覺，並以三個重點補充說明
    structure:
      title_count: 1
      key_point_count: 3
      visual_count: 1
      sequence: false
      comparison: false
      data: false
    suitable_roles:
      - speaker_intro
      - profile
      - framework_explainer
    layout_bias:
      - right-text-left-image
      - hero-visual-with-side-points
    notes:
      - 文字與圖片要視覺等重，不可單邊過空

  - id: 1-plus-data
    display_name: 1 標題 + 數據主體
    summary: 一個標題搭配一張圖表、一組統計或資料視覺
    structure:
      title_count: 1
      key_point_count: data-led
      visual_count: 1
      sequence: false
      comparison: optional
      data: true
    suitable_roles:
      - data_insight
      - framework_explainer
    layout_bias:
      - chart-focus
      - stat-cards
      - table-focus
    notes:
      - 之後需和資料型 renderer 或 chart schema 對接

  - id: 1-plus-big-number
    display_name: 1 標題 + 大數字
    summary: 一個標題搭配單一大數字或 KPI
    structure:
      title_count: 1
      key_point_count: 1-kpi
      visual_count: 0
      sequence: false
      comparison: false
      data: true
    suitable_roles:
      - data_insight
      - takeaway
    layout_bias:
      - big-number
      - stat-highlight
    notes:
      - 數字是視覺主角，文字應退居說明層

  - id: 1-plus-table
    display_name: 1 標題 + 表格
    summary: 一個標題搭配一張表格或欄位矩陣
    structure:
      title_count: 1
      key_point_count: table-rows
      visual_count: 0
      sequence: false
      comparison: optional
      data: true
    suitable_roles:
      - data_insight
      - example_demo
    layout_bias:
      - table-focus
      - table-with-summary
    notes:
      - 應限制欄列數，避免過度擁擠

  - id: chapter-marker
    display_name: 章節標記
    summary: 章節編號與章節名稱構成的極簡過場骨架
    structure:
      title_count: 1
      key_point_count: 1-marker
      visual_count: optional
      sequence: false
      comparison: false
      data: false
    suitable_roles:
      - chapter_opener
    layout_bias:
      - chapter-opener
      - title-center
    notes:
      - 其功能是節奏轉場，不是資訊承載

  - id: 1-plus-meta
    display_name: 1 標題 + 補充資訊
    summary: 一個標題搭配日期、講者、場次、聯絡資訊等 meta
    structure:
      title_count: 1
      key_point_count: meta
      visual_count: optional
      sequence: false
      comparison: false
      data: false
    suitable_roles:
      - cover
      - closing
    layout_bias:
      - cover-meta
      - closing-meta
    notes:
      - meta 應明顯次於主標題
