id: "historical-editorial"
display_name: "歷史醫學編輯風"
intent: "像 20 世紀初醫學期刊或非 fiction 書頁一樣，嚴謹、克制、帶有歷史重量與人文感"

visual_base:
  background:
    color: "#FAF8F3"
    texture: "subtle linen texture"
    style_note: "溫暖但克制的紙張感，像高品質老期刊內頁"

  color_system:
    primary:
      hex: "#1A1A1A"
      use: "主標題、正文、主要線條"
    secondary:
      hex: "#4D463D"
      use: "次要說明、低對比文字、淡化註記"
    accent:
      hex: "#C4890A"
      use: "label、細分隔線、局部醫學標示"
    support:
      - hex: "#8C7A5B"
        use: "暖棕色版畫與解剖圖輔助色"

  typography_system:
    heading:
      family: "Source Han Sans / Noto Sans CJK"
      weight: "700-900"
      tone: "沉重、學術、出版編輯感"
    body:
      family: "Noto Serif CJK / Source Han Serif"
      weight: "400-500"
      tone: "內斂、可讀、帶期刊文本氣息"

  image_language:
    style: "vintage scientific illustration"
    treatment: "warm monochrome engraving with restrained ochre accents"

  mood:
    - "scholarly"
    - "poignant"
    - "historically dignified"

decoration_system:
  edge_policy:
    allowed_zone: "outer 10% margin zone"
    purpose: "只在頁面外緣補足出版感與完成度，不可削弱正文與圖像敘事"

  vocabulary:
    - id: "double-thin-rules"
      visual: "兩條極細水平分隔線，charcoal 20% opacity"
      placement: "top-left, top margin"
      density: "medium"
      usage_note: "適合做期刊式頁首結構，不可過長或過粗"

    - id: "registration-squares"
      visual: "三個小型印刷註冊方塊，charcoal 25% opacity"
      placement: "bottom-right"
      density: "low"
      usage_note: "只作為印刷 colophon 意象，不應被誤認為主要資訊"

composition_defaults:
  contrast_strategy: "以字重、線條粗細與黑金對比取代大面積色塊對比"
  rhythm_strategy: "透過標籤、細線、標題、正文、caption 建立出版式垂直節奏"
  restraint_note: "避免任何多餘 ornament；裝飾必須看起來像印刷慣例，而不是圖形設計花樣"

renderer_notes:
  image_prompt_bias: "The slide should feel like a page from a 1906 medical journal: rigorous, human, and historically dignified."
