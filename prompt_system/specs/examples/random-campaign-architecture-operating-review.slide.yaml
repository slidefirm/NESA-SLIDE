slide_id: "random-campaign-architecture-001"
page_role: "content"
content_pattern: "campaign-architecture"
page_goal: "用一頁說清楚募課活動的目標、受眾、主要戰術與衡量方式"

theme_ref: "operating-review"
layout:
  strategy_id: "campaign-architecture"
  description: "上方先交代活動目標與受眾，中段用模組化 tactic cards 展開執行架構，底部收束 KPI 與預算假設"
  family: "行銷類"
  title_alignment_mode: "content_anchored_left"
  structure:
    primary_region: "中段 tactic modules"
    secondary_region: "上方 goal/audience framing 與下方 KPI note"
    empty_region: "卡片模組之間的 gutter 與底部左右兩端保留呼吸感"

design_elements:
  - "review-band"
  - "health-chip"
  - "owner-tag"

content:
  title:
    text: "AI 簡報工作坊 Campaign Architecture"
    role: "primary_message"

  subtitle:
    text: "用三週招募節奏，把認知、報名與完課動機串成一條可追蹤的轉換路徑。"
    role: "supporting_message"

  body:
    type: "tactic_cards"
    items:
      - channel: "LinkedIn"
        tactic: "發布講師觀點短帖與學員成果 before/after 圖"
        role: "建立可信度與高意圖流量入口"
      - channel: "Email"
        tactic: "寄送兩波 case-study newsletter，主打課綱與實作成果"
        role: "喚回既有名單、推進考慮中受眾"
      - channel: "Webinar"
        tactic: "辦一場 30 分鐘公開說明會，現場 demo 課程節奏"
        role: "降低報名不確定感，提升轉換率"
      - channel: "Partner"
        tactic: "與社群夥伴交換貼文與折扣碼，鎖定設計主管族群"
        role: "擴大觸及並導入相近輪廓名單"
    note: "每張 tactic card 需維持短句、掃描式節奏，避免變成長段落。"

  visual:
    type: "diagram"
    description: "主體不是插圖，而是 campaign modules 本身；以淡色 review bands 和小型 status chips 做節奏標示。"
    role: "supporting_visual"

  meta:
    - type: "goal"
      label: "Goal"
      text: "三週內取得 120 筆報名、30 筆高意圖諮詢"
    - type: "audience"
      label: "Audience"
      text: "中小企業內訓負責人、顧問型講師、想升級簡報能力的設計主管"
    - type: "message"
      label: "Message"
      text: "這不是教模板，而是把 AI、敘事與商務溝通整成可複製的簡報工作流"
    - type: "kpi_budget_note"
      text: "KPI: CTR 2.8% / webinar 報名 80 / final conversion 15%; Budget: NT$45,000; Assumption: partner traffic 占總 lead 25%"

content_safe_zone:
  x_range: [10, 90]
  y_range: [10, 90]
  rule: "標題、framing block、tactic cards 與 KPI note 不得侵入四周 10% 邊界。"
  decoration_exception: "review bands 與低權重 status chips 可落在邊界附近，但不可與主文字重疊。"

composition_rules:
  alignment_rules:
    - "title、subtitle、goal/audience/message 與 tactic modules 左緣需共線。"
    - "底部 KPI note 應與 tactic grid 共用外框寬度，不可比主模組更搶眼。"

  balance_rules:
    - "中段 tactic modules 是主角，上下 framing 與 KPI 區只負責建立閱讀順序。"
    - "若右側模組資訊較重，需用留白或較淡的底卡平衡，避免畫面右傾。"

  dominance_rules:
    primary_focus: "tactic modules"
    secondary_focus: "title 與 goal framing"
    restraint: "budget、assumption、status chips 必須降權，不能變成視覺主角"

  spacing_rules:
    - "各 tactic card 之間至少保留一致 gutter，維持 campaign map 的節奏感。"
    - "goal/audience framing 與 tactic 區之間要有明顯分段，不可黏成一整坨文字。"

  hierarchy_rules:
    - "主標最大，其次是 tactic card 標頭，再來才是 KPI 與補充說明。"
    - "同層級 tactic cards 的卡片重量必須一致，不可出現單一卡片過度放大。"

  visual_exclusivity_rules:
    - "本頁不建立獨立 hero image，畫面主體就是 tactic architecture 本身。"

  visual_budget_rules:
    - "裝飾性 review band 只能幫助分段，不可比 tactic 內容更醒目。"
    - "supporting chips 與 owner tags 只能作為導航，不可稀釋主要訊息。"

decoration_application:
  use_2a: true
  use_2b: true
  2b_placements:
    top_left: "review-band"
    top_right: "none"
    bottom_left: "owner-tag"
    bottom_right: "health-chip"

renderer_notes:
  image_prompt_note: "整體應像一頁乾淨的 QBR / campaign review，讓人一眼看懂目標、戰術與衡量方式。"
  pptx_note: "若輸出 PPTX，tactic cards 與 status chips 應拆成 shape + text，而不是單張圖片。"

validation:
  status: "manual_review_pending"
  checks:
    safe_zone_check:
      intent: "檢查主內容是否避開四周 10% 邊界區"
      status: "not_checked"
      notes: ""
    alignment_check:
      intent: "檢查標題、framing block、cards 與 KPI note 是否依規則對齊"
      status: "not_checked"
      notes: ""
    overlap_check:
      intent: "檢查卡片、chips 與文字之間是否互相干擾"
      status: "not_checked"
      notes: ""
    readability_check:
      intent: "檢查 tactic card 內容是否因字數過多而失去掃描性"
      status: "not_checked"
      notes: ""
