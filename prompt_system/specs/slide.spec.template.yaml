slide_id: "{SLIDE_ID}"
page_role: "{cover|chapter|content|comparison|evidence|process|quote|closing}"
content_pattern: "{CONTENT_PATTERN_ID}"
page_goal: "{這頁想完成的溝通目的}"

theme_ref: "{THEME_ID}"
layout:
  strategy_id: "{LAYOUT_ID}"
  module_style: "{editorial-module|none}"
  description: "{這張投影片的主要架構與內涵元素}"
  family: "{layout family}"
  title_alignment_mode: "{centered_header|content_anchored_left}"
  structure:
    primary_region: "{主要重心區}"
    secondary_region: "{次要輔助區}"
    empty_region: "{預期保留留白的區域}"

content:
  title:
    text: "{TITLE}"
    role: "primary_message"

  subtitle:
    text: "{SUBTITLE}"
    role: "supporting_message"

  body:
    type: "{bullet_list|paragraph|matrix|timeline|quote}"
    items: []
    note: "{內容限制或寫法}"

  visual:
    type: "{photo|illustration|chart|diagram|none}"
    description: "{視覺內容描述}"
    role: "{visual_anchor|supporting_visual|data_visual}"

  meta: []

constraints:
  content_safe_zone:
    x_range: [10, 90]
    y_range: [10, 90]
    rule: "標題、正文、圖例、標籤、數據等主要內容不得進入四周 10% 邊界"
    decoration_exception: "2B 裝飾元素可使用邊界區，但不得壓到主內容"

  alignment_rules:
    - "{哪些元素左緣對齊}"
    - "{哪些元素共用中心線或基線}"
    - "{若標題置左，標題/副標/分隔線需與主內容模組左緣共線}"
    - "{若標題置中，標題與副標需共用同一條水平中心線}"

  balance_rules:
    - "{左右欄需視覺等重}"
    - "{若主圖偏重，文字區需用留白或色塊平衡}"
    - "{輔助插圖不得壓縮主標題與正文的可讀空間}"

  dominance_rules:
    primary_focus: "{主角元素}"
    secondary_focus: "{次主角元素}"
    restraint: "{哪些元素必須降權}"

  spacing_rules:
    - "{區塊之間的最小距離}"
    - "{上下節奏或欄間距規則}"

  hierarchy_rules:
    - "{主標題一定最大}"
    - "{模組標題或次標題次之}"

  visual_exclusivity_rules:
    - "{若單側已有主插圖，另一側不建立第二個獨立視覺主體}"

  visual_budget_rules:
    - "{若插圖僅為輔助視覺，其版面權重不得高於文字主內容}"
    - "{側邊插圖應控制在支撐敘事的尺度，不可反客為主}"

  prompt_translation_rules:
    - "{轉成 image prompt 時，不直接輸出 x=、y=、百分比座標字串}"
    - "{空間關係改寫成自然語言，例如左側、右側、上方、下方、置中、貼齊主內容左緣}"

decoration_application:
  use_2a: true
  use_2b: true
  2b_placements:
    top_left: "{decor id or none}"
    top_right: "{decor id or none}"
    bottom_left: "{decor id or none}"
    bottom_right: "{decor id or none}"

renderer_notes:
  image_prompt_note: "{若要轉成圖片 prompt，可補充的畫面描述}"
  pptx_note: "{若要輸出 PPTX，需要注意的框線或形狀語意}"

validation:
  status: "{not_checked|manual_review_pending|passed|failed}"
  checks:
    safe_zone_check:
      intent: "檢查主要訊息是否避開四周 10% 邊界區"
      status: "{not_checked|pass|fail}"
      notes: "{若失敗，記錄是哪一類主內容侵入邊界}"
    alignment_check:
      intent: "檢查標題、副標、模組、分隔線是否依規則對齊"
      status: "{not_checked|pass|fail}"
      notes: "{若失敗，記錄是左緣、中心線、基線或模組對齊問題}"
    overlap_check:
      intent: "檢查文字、圖像、裝飾之間是否出現視覺重疊或互相干擾"
      status: "{not_checked|pass|fail}"
      notes: "{若失敗，記錄重疊發生在哪些元素之間}"
    readability_check:
      intent: "檢查字級是否過小、行距是否過密，造成閱讀困難"
      status: "{not_checked|pass|fail}"
      notes: "{若失敗，記錄是哪個文字區塊可讀性不足}"
