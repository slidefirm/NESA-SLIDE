validation_layer:
  version: "v1"
  purpose: "在 renderer 輸出之後，針對版面品質做最後檢查。現階段先作為人工/半人工檢查模板，不假設已具備自動檢測能力。"

  check_order:
    - safe_zone_check
    - alignment_check
    - overlap_check
    - readability_check

  checks:
    safe_zone_check:
      question: "四周 10% 邊界區是否完全沒有承載主要訊息？"
      pass_criteria:
        - "標題、正文、圖表、圖例、數字、標籤沒有侵入邊界安全區"
        - "允許存在於邊界區的只有 2B 裝飾或極低權重 structural marks"
      fail_examples:
        - "主標題貼邊"
        - "正文條列貼近邊角"
        - "重要數據或圖例掉進邊界區"

    alignment_check:
      question: "主要內容是否依照既定對齊規則確實對齊？"
      pass_criteria:
        - "若為 centered_header，主標與副標共用中心軸"
        - "若為 content_anchored_left，主標、副標、分隔線、主模組左緣共線"
        - "多欄或多模組之間有清楚的共線、共邊或共基線關係"
      fail_examples:
        - "標題看似靠左，但與內容左緣沒對齊"
        - "卡片彼此寬度相近，但上下或左右邊界不齊"
        - "分隔線與標題系統脫節"

    overlap_check:
      question: "文字、圖像、裝飾之間是否有視覺重疊或干擾？"
      pass_criteria:
        - "主要文字不被插圖、裝飾、框線或圖表壓到"
        - "插圖與文字模組之間保有可辨識的呼吸空間"
        - "裝飾元素不造成內容閱讀誤判"
      fail_examples:
        - "插圖壓到文字區"
        - "框線穿過文字或圖像"
        - "裝飾點陣太密，干擾文字辨識"

    readability_check:
      question: "文字是否足夠易讀，而非因字級過小或節奏過密而難以閱讀？"
      pass_criteria:
        - "主標、次標、正文之間有足夠字級層次"
        - "正文大小在投影片觀看距離下仍可辨識"
        - "行距、段距、欄寬不造成擁擠感"
      fail_examples:
        - "副標或 meta 小到幾乎不可讀"
        - "三欄內容因欄太窄而被迫縮小字體"
        - "條列行距過密，閱讀節奏卡住"

  result_template:
    overall_status: "{not_checked|manual_review_pending|passed|failed}"
    failed_checks: []
    reviewer_notes: "{人工檢查備註}"
