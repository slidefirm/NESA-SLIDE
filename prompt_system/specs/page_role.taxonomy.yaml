version: 1
description: >
  Page role taxonomy defines what communicative job a slide performs inside a deck.
  It is higher-level than layout and should be chosen before visual arrangement.

page_roles:
  - id: cover
    display_name: 封面
    purpose: 建立主題、場次與第一印象
    typical_content:
      - 主標題
      - 副標或標語
      - 日期、講者、場次資訊
    common_patterns:
      - 1-plus-1
      - 1-plus-meta
    notes:
      - 視覺主角應高度集中
      - 不適合塞入大量說明文字

  - id: speaker_intro
    display_name: 講者介紹
    purpose: 建立講者可信度與背景脈絡
    typical_content:
      - 姓名或品牌
      - 頭銜
      - 3到4則代表性資歷
      - 肖像或品牌識別
    common_patterns:
      - 1-plus-3
      - 1-plus-4
      - 1-plus-visual-plus-3
    notes:
      - 適合等權重點或人物主圖搭配條列

  - id: warmup_question
    display_name: 暖場提問
    purpose: 啟動觀眾注意力與互動
    typical_content:
      - 一個主問題
      - 1到2個選項或回應方式
    common_patterns:
      - 1-plus-1
      - 1-plus-2
      - 1-plus-question-answer
    notes:
      - 應快速可讀，不要過度資訊化

  - id: objective
    display_name: 學習目標
    purpose: 說明這一段或這一課的核心學習成果
    typical_content:
      - 目標標題
      - 1到3個能力或結果描述
    common_patterns:
      - 1-plus-1
      - 1-plus-3
    notes:
      - 常偏 statement 型頁面

  - id: agenda
    display_name: 課程大綱
    purpose: 交代全局結構與章節順序
    typical_content:
      - 章節清單
      - 流程順序
      - 模組名稱
    common_patterns:
      - 1-plus-n-list
      - 1-plus-sequence
      - 1-plus-4
    notes:
      - 可偏 list 或 sequence，依章節間是否有先後關係決定

  - id: chapter_opener
    display_name: 章節過場
    purpose: 提醒觀眾目前進入新的段落
    typical_content:
      - 章節編號
      - 章節名稱
      - 極短副標
    common_patterns:
      - chapter-marker
      - 1-plus-1
    notes:
      - 內容少但節奏功能強

  - id: problem_statement
    display_name: 問題陳述
    purpose: 提出痛點、疑問或認知衝突
    typical_content:
      - 一句大問題
      - 補充句或例子
    common_patterns:
      - 1-plus-1
      - 1-plus-example-block
    notes:
      - 常作為段落開場或轉折

  - id: framework_explainer
    display_name: 架構解釋
    purpose: 解釋概念、方法、分類或心智模型
    typical_content:
      - 標題
      - 2到4個平行要素
      - 可選擇搭配小圖示或示意圖
    common_patterns:
      - 1-plus-2
      - 1-plus-3
      - 1-plus-4
      - 1-plus-comparison
    notes:
      - 教學型 deck 的核心頁型

  - id: example_demo
    display_name: 示範案例
    purpose: 展示輸入輸出、before/after、實際案例或操作結果
    typical_content:
      - 題目
      - 範例輸入
      - 範例輸出
      - 對照說明
    common_patterns:
      - 1-plus-example-block
      - 1-plus-comparison
      - 1-plus-question-answer
    notes:
      - 內容密度通常較高，需要清楚分區

  - id: exercise
    display_name: 練習與操作
    purpose: 給學員任務、步驟或行動指令
    typical_content:
      - 任務標題
      - 步驟
      - 時間限制
      - 操作提示
    common_patterns:
      - 1-plus-sequence
      - 1-plus-3
      - 1-plus-n-list
    notes:
      - 適合 sequence 或 checklist 類型

  - id: comparison
    display_name: 比較頁
    purpose: 比較兩種做法、兩個觀點或兩個版本
    typical_content:
      - 比較對象 A
      - 比較對象 B
      - 差異點
    common_patterns:
      - 1-plus-comparison
      - 1-plus-2
    notes:
      - 左右兩側必須視覺等重或有明確主從

  - id: data_insight
    display_name: 數據洞察
    purpose: 用數據、統計或圖表支持觀點
    typical_content:
      - 指標
      - 圖表
      - 數字摘要
      - 簡短解讀
    common_patterns:
      - 1-plus-data
      - 1-plus-big-number
      - 1-plus-table
    notes:
      - 之後應與 chart/table renderer 對接

  - id: profile
    display_name: 人物介紹
    purpose: 呈現人物背景、故事或角色定位
    typical_content:
      - 人名
      - 角色
      - 經歷重點
      - 人物照片或插圖
    common_patterns:
      - 1-plus-visual-plus-3
      - 1-plus-3
      - 1-plus-1
    notes:
      - 可視內容決定是敘事型還是資歷型

  - id: takeaway
    display_name: 重點整理
    purpose: 收斂本段或整份 deck 的核心訊息
    typical_content:
      - 結論標題
      - 3到5個重點
      - 行動呼籲或提醒
    common_patterns:
      - 1-plus-3
      - 1-plus-4
      - 1-plus-n-list
    notes:
      - 是高頻總結頁型

  - id: closing
    display_name: 結尾
    purpose: 收尾、致謝、呼籲下一步
    typical_content:
      - 結尾標題
      - 一句結論或 CTA
      - 聯絡方式或謝謝
    common_patterns:
      - 1-plus-1
      - 1-plus-meta
    notes:
      - 應比 cover 更收斂，不宜太滿
