schema_version: 1
id: html-preset-registry
display_name: HTML Preset Registry
purpose: >
  統一管理 PRESET 展示區的名稱、公開狀態、順序與能力。
  Theme Lab JSON 只保存完整案例內容；preset-themes.yaml 只保存可重複套用、且不綁內容／Layout 的 HTML 外觀契約。
  Gallery 與檢查工具不得再自行合併兩邊來猜哪些項目應公開；new-deck renderer 也不得
  從 Theme Lab、Style Case 或 Gallery artifact 回讀內容、Layout 或 CSS。

publication_policy:
  gallery_status: published
  accepted_gallery_count: 17
  draft_requires_reason: true

capability_definitions:
  theme-lab-case: 有一份完整 Theme Lab 案例，不能因此假設可套用到任意內容與 Layout。
  reusable-preset: 有不含舊內容、舊 Layout 或舊 CSS 的 HTML 視覺契約，可依正式 renderer 契約重複套用。

source_roles:
  theme_lab:
    - prompt_system/demos/html-theme-lab.json
    - prompt_system/demos/html-theme-lab-extensions.json
  reusable_presets:
    - prompt_system/renderers/html/preset-themes.yaml

